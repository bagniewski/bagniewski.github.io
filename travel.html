<p style="padding: 20px 20px 20px 50px;"></p>

<link
    href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css"
    rel="stylesheet"
>

<style>
    .map-page {
        position: relative;
        margin: 0;
        padding: 20px 50px;
    }

    #map {
        width: 100%;
        height: 560px;
    }

    /* Style selector */
    #style-selector {
        position: absolute;
        top: 60px;
        left: 60px;
        z-index: 1;
        padding: 6px;
        background: white;
        border-radius: 4px;
        font-family: Arial, sans-serif;
        font-size: 11.5px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }

    #style-selector select {
        padding: 4px;
        font-size: 11.5px;
    }

    /* Popup boxes */
    .mapboxgl-popup-content {
        padding: 8px 10px;
    }

    .mapboxgl-popup-close-button {
        padding: 2px 6px;
    }
</style>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>

<script>
    mapboxgl.accessToken = 'pk.eyJ1IjoiYmtpdHdlIiwiYSI6ImNtdTVlZXE2ZzBkemgyenNoOGZsazYzYXYifQ.jIsiWt1bOF69w0oQYvhaxA';

    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/outdoors-v12',
        center: [0, 0],
        zoom: 1.0,
        projection: 'equalEarth'
    });

    // Navigation controls
    map.addControl(
        new mapboxgl.NavigationControl({
            showCompass: false
        }),
        'top-right'
    );

    // Distance scale
    const scale = new mapboxgl.ScaleControl({
        maxWidth: 120,
        unit: 'metric'
    });

    map.addControl(scale, 'bottom-left');

    function addPlaces() {
        map.addSource('places', {
            type: 'geojson',

            // Replace this with the correct path to your GeoJSON file
            data: './files/whereivebeen.geojson'
        });

        // Visible places
        map.addLayer({
            id: 'places',
            type: 'circle',
            source: 'places',
            paint: {
                'circle-radius': 3.5,
                'circle-color': '#e31a1c',
                'circle-stroke-color': '#fff',
                'circle-stroke-width': 1.5
            }
        });

        // Larger invisible click area
        map.addLayer({
            id: 'places-hit-area',
            type: 'circle',
            source: 'places',
            paint: {
                'circle-radius': 12,
                'circle-color': '#000',
                'circle-opacity': 0
            }
        });

        // Click on a place
        map.on('click', 'places-hit-area', (e) => {
            const feature = e.features[0];
            const coordinates = feature.geometry.coordinates.slice();
            const location = feature.properties.location;
            const country = feature.properties.country;

            new mapboxgl.Popup({
                closeButton: true,
                closeOnClick: true
            })
                .setLngLat(coordinates)
                .setHTML(`
                    <strong>${location}</strong><br>
                    ${country}
                `)
                .addTo(map);
        });

        // Change cursor when hovering over a place
        map.on('mouseenter', 'places-hit-area', () => {
            map.getCanvas().style.cursor = 'pointer';
        });

        map.on('mouseleave', 'places-hit-area', () => {
            map.getCanvas().style.cursor = '';
        });
    }

    // Add places when the map initially loads
    map.on('load', () => {
        addPlaces();
    });

    // Change map style
    document
        .getElementById('style-select')
        .addEventListener('change', (event) => {
            map.setStyle(event.target.value);
        });

    // Re-add custom layers after changing style
    map.on('style.load', () => {
        if (!map.getSource('places')) {
            addPlaces();
        }
    });
</script>
